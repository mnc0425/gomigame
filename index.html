<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOMIGAME</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            background-color: #121214;
            color: #f0f0f0;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { 
            margin: 0 0 10px 0; 
            font-size: clamp(16px, 5vw, 24px); 
            color: #4da6ff; 
            text-align: center;
        }
        canvas { 
            background: #0a0a0f; 
            border: 2px solid #444; 
            border-radius: 8px; 
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <h1>神に誓うな己に誓え</h1>

    <canvas id="gameCanvas" width="800" height="300"></canvas>
    <audio id="bgmAudio" src="bgm.mp3" loop></audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bgmAudio = document.getElementById('bgmAudio');

        bgmAudio.volume = 0.25;

        let bgmStarted = false;
        function playBGM() {
            if (bgmStarted) return;
            bgmAudio.play().then(() => { bgmStarted = true; }).catch(() => {});
        }

        function stopBGM() {
            bgmAudio.pause();
            bgmAudio.currentTime = 0;
            bgmStarted = false;
        }

        const BOSS_SETTINGS = [
            { name: 'boss',  w: 90, h: 60, speedMult: 1.0,  isFloating: false },
            { name: 'boss2', w: 75, h: 75, speedMult: 1.5,  isFloating: false },
            { name: 'boss3', w: 60, h: 90, speedMult: 0.7,  isFloating: false },
            { name: 'boss4', w: 60, h: 90, speedMult: 1.25, isFloating: false },
            { name: 'boss5', w: 90, h: 60, speedMult: 0.5,  isFloating: true  }
        ];

        const bossImages = [];
        BOSS_SETTINGS.forEach((setting, index) => {
            const img = new Image();
            img.src = (index === 0) ? 'boss.png' : `${setting.name}.png`;
            bossImages.push(img);
        });

        let player = {
            x: 80,
            y: 205,
            w: 20,
            h: 40,
            vy: 0,
            grounded: true,
            animFrame: 0
        };
        const gravity = 0.6;
        const jumpPower = -12.5;

        let isDead = false;
        let canRetry = true; // リトライ可能フラグ
        let deadTime = 0;    // 死亡した時刻
        let score = 0;
        let baseGameSpeed = 6;
        let frameCount = 0;
        let obstacles = [];

        function doJump() {
            if (isDead) return;
            playBGM();
            if (player.grounded) {
                player.vy = jumpPower;
                player.grounded = false;
            }
        }

        function handleInput() {
            if (isDead) {
                // 1秒経過（1000ミリ秒）していない場合は無視
                if (canRetry && (Date.now() - deadTime >= 1000)) {
                    resetGame();
                }
            } else {
                doJump();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'ArrowUp') handleInput();
            if (e.key === 'r' || e.key === 'R') {
                if (isDead && Date.now() - deadTime >= 1000) resetGame();
                else if (!isDead) resetGame();
            }
        });
        
        window.addEventListener('touchstart', (e) => {
            handleInput();
        }, { passive: true });

        document.addEventListener('click', (e) => {
            if (e.pointerType === 'mouse') {
                handleInput();
            }
        });

        function resetGame() {
            player.y = 205; player.vy = 0; player.grounded = true;
            obstacles = [];
            score = 0;
            baseGameSpeed = 6;
            frameCount = 0;
            isDead = false;
            canRetry = true;
            playBGM();
        }

        function triggerGameOver() {
            isDead = true;
            deadTime = Date.now(); // 死亡時刻を記録
            stopBGM();
        }

        function spawnObstacle() {
            let bossIndex;
            const rand = Math.random();

            if (rand < 0.44) {
                bossIndex = 0;
            } else if (rand < 0.84) {
                bossIndex = 1;
            } else if (rand < 0.94) {
                bossIndex = 2;
            } else if (rand < 0.99) {
                bossIndex = 3;
            } else {
                bossIndex = 4;
            }

            const setting = BOSS_SETTINGS[bossIndex];

            const minDistance = setting.isFloating ? 380 : 240;
            const lastObs = obstacles[obstacles.length - 1];
            if (lastObs && (canvas.width - lastObs.x < minDistance)) {
                return;
            }

            let yPos;
            if (setting.isFloating) {
                yPos = 145; 
            } else {
                yPos = 245 - setting.h;
            }

            obstacles.push({
                x: canvas.width,
                y: yPos,
                w: setting.w,
                h: setting.h,
                speed: baseGameSpeed * setting.speedMult,
                imgIndex: bossIndex,
                isFloating: setting.isFloating
            });
        }

        function update() {
            if (isDead) return;

            frameCount++;
            score++;

            const currentDisplayScore = Math.floor(score / 10);

            // 通常のテンポアップ
            if (frameCount % 400 === 0) baseGameSpeed += 0.15;

            // スコア310到達時にスピードを急速アップ（基準速度を上昇）
            if (currentDisplayScore >= 310 && baseGameSpeed < 10) {
                baseGameSpeed = 10; // スピードの底上げ
            }

            if (frameCount % Math.max(25, Math.floor(800 / baseGameSpeed)) === 0 && Math.random() < 0.75) {
                spawnObstacle();
            }

            player.vy += gravity;
            player.y += player.vy;

            if (player.y >= 205) {
                player.y = 205;
                player.vy = 0;
                player.grounded = true;
            }

            if (player.grounded) {
                player.animFrame += baseGameSpeed * 0.08;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= obs.speed;

                const padding = 4;
                if (
                    player.x + padding < obs.x + obs.w - padding &&
                    player.x + player.w - padding > obs.x + padding &&
                    player.y + padding < obs.y + obs.h - padding &&
                    player.y + player.h - padding > obs.y + padding
                ) {
                    triggerGameOver();
                }

                if (obs.x + obs.w < 0) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function drawPlayer(x, y, grounded, frame) {
            ctx.strokeStyle = '#00ff66';
            ctx.fillStyle = '#00ff66';
            ctx.lineWidth = 2.5;

            const headRadius = 5;
            const headX = x + 10;
            const headY = y + headRadius;

            ctx.beginPath();
            ctx.arc(headX, headY, headRadius, 0, Math.PI * 2);
            ctx.stroke();

            const bodyStartY = headY + headRadius;
            const bodyEndY = y + 25;
            ctx.beginPath();
            ctx.moveTo(headX, bodyStartY);
            ctx.lineTo(headX, bodyEndY);
            ctx.stroke();

            if (grounded) {
                const legAngle = Math.sin(frame) * 12;
                const armAngle = Math.cos(frame) * 10;

                ctx.beginPath();
                ctx.moveTo(headX, bodyEndY);
                ctx.lineTo(headX - legAngle, y + 40);
                ctx.moveTo(headX, bodyEndY);
                ctx.lineTo(headX + legAngle, y + 40);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(headX, bodyStartY + 4);
                ctx.lineTo(headX - armAngle, bodyStartY + 14);
                ctx.moveTo(headX, bodyStartY + 4);
                ctx.lineTo(headX + armAngle, bodyStartY + 14);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(headX, bodyEndY);
                ctx.lineTo(headX - 8, y + 35);
                ctx.moveTo(headX, bodyEndY);
                ctx.lineTo(headX + 8, y + 33);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(headX, bodyStartY + 4);
                ctx.lineTo(headX - 10, bodyStartY - 2);
                ctx.moveTo(headX, bodyStartY + 4);
                ctx.lineTo(headX + 10, bodyStartY - 2);
                ctx.stroke();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#4a4a5a';
            ctx.fillRect(0, 245, canvas.width, 55);
            ctx.fillStyle = '#00ff66';
            ctx.fillRect(0, 245, canvas.width, 3);

            drawPlayer(player.x, player.y, player.grounded, player.animFrame);

            obstacles.forEach(obs => {
                const img = bossImages[obs.imgIndex];
                if (img.complete && img.naturalWidth !== 0) {
                    ctx.drawImage(img, obs.x, obs.y, obs.w, obs.h);
                } else {
                    ctx.fillStyle = obs.isFloating ? '#ff00aa' : '#aa00ff';
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(BOSS_SETTINGS[obs.imgIndex].name, obs.x + obs.w/2, obs.y + obs.h/2);
                }
            });

            ctx.fillStyle = '#ffffff';
            ctx.font = '20px monospace';
            ctx.textAlign = 'right';
            ctx.fillText('SCORE: ' + Math.floor(score / 10), canvas.width - 20, 35);

            if (isDead) {
                ctx.textAlign = 'center';
                ctx.fillStyle = '#ff3344';
                ctx.font = 'bold 42px sans-serif';
                ctx.fillText('ざんねん', canvas.width / 2, 130);
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px sans-serif';
                ctx.fillText('さようなら', canvas.width / 2, 170);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
