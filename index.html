<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOMIGAME</title>
    <style>
        body {
            background-color: #121214;
            color: #f0f0f0;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin: 0 0 15px 0; font-size: 24px; color: #4da6ff; }
        canvas { background: #0a0a0f; border: 2px solid #444; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>神に誓うな己に誓え</h1>

    <canvas id="gameCanvas" width="800" height="300"></canvas>
    <audio id="bgmAudio" src="bgm.mp3" loop></audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bgmAudio = document.getElementById('bgmAudio');

        // 音量を25%に設定
        bgmAudio.volume = 0.25;

        let bgmStarted = false;
        function playBGM() {
            if (bgmStarted) return;
            bgmAudio.play().then(() => { bgmStarted = true; }).catch(() => {});
        }

        function stopBGM() {
            bgmAudio.pause();
            bgmAudio.currentTime = 0;
            bgmStarted = false;
        }

        // --- ボス（敵）ごとの個別設定 ---
        const BOSS_SETTINGS = [
            { name: 'boss',  w: 90, h: 60, speedMult: 1.0,  isFloating: false },
            { name: 'boss2', w: 75, h: 75, speedMult: 1.5,  isFloating: false },
            { name: 'boss3', w: 60, h: 90, speedMult: 0.7,  isFloating: false },
            { name: 'boss4', w: 60, h: 90, speedMult: 1.25, isFloating: false },
            { name: 'boss5', w: 90, h: 60, speedMult: 0.5,  isFloating: true  }
        ];

        // 画像の読み込み
        const bossImages = [];
        BOSS_SETTINGS.forEach((setting, index) => {
            const img = new Image();
            img.src = (index === 0) ? 'boss.png' : `${setting.name}.png`;
            bossImages.push(img);
        });

        // --- プレイヤー設定（棒人間） ---
        let player = {
            x: 80,
            y: 205,
            w: 20,
            h: 40,
            vy: 0,
            grounded: true,
            animFrame: 0
        };
        const gravity = 0.6;
        const jumpPower = -12.5;

        // --- ゲーム状態 ---
        let isDead = false;
        let score = 0;
        let baseGameSpeed = 6;
        let frameCount = 0;
        let obstacles = [];

        // --- ジャンプ操作 ---
        function doJump() {
            if (isDead) return;
            playBGM();
            if (player.grounded) {
                player.vy = jumpPower;
                player.grounded = false;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'ArrowUp') doJump();
            if (e.key === 'r' || e.key === 'R') resetGame();
        });
        document.addEventListener('click', () => {
            if (isDead) resetGame();
            else doJump();
        });

        function resetGame() {
            player.y = 205; player.vy = 0; player.grounded = true;
            obstacles = [];
            score = 0;
            baseGameSpeed = 6;
            frameCount = 0;
            isDead = false;
            playBGM();
        }

        // --- 障害物（ボス写真）の生成 ---
        function spawnObstacle() {
            let bossIndex;
            const rand = Math.random();

            // 指定の出現確率（確率の累積値で判定）
            if (rand < 0.44) {
                bossIndex = 0; // boss (44%)
            } else if (rand < 0.84) {
                bossIndex = 1; // boss2 (40%)
            } else if (rand < 0.94) {
                bossIndex = 2; // boss3 (10%)
            } else if (rand < 0.99) {
                bossIndex = 3; // boss4 (5%)
            } else {
                bossIndex = 4; // boss5 (1%)
            }

            const setting = BOSS_SETTINGS[bossIndex];

            // 安全距離のチェック (boss5の場合はより広くスペースを確保して詰みを防止)
            const minDistance = setting.isFloating ? 380 : 240;
            const lastObs = obstacles[obstacles.length - 1];
            if (lastObs && (canvas.width - lastObs.x < minDistance)) {
                return; // 前の敵と近すぎる場合は生成をスキップ
            }

            let yPos;
            if (setting.isFloating) {
                yPos = 145; 
            } else {
                yPos = 245 - setting.h;
            }

            obstacles.push({
                x: canvas.width,
                y: yPos,
                w: setting.w,
                h: setting.h,
                speed: baseGameSpeed * setting.speedMult,
                imgIndex: bossIndex,
                isFloating: setting.isFloating
            });
        }

        // --- 更新処理 ---
        function update() {
            if (isDead) return;

            frameCount++;
            score++;

            // テンポアップ
            if (frameCount % 400 === 0) baseGameSpeed += 0.15;

            // 障害物出現ロジック
            if (frameCount % Math.max(35, Math.floor(900 / baseGameSpeed)) === 0 && Math.random() < 0.75) {
                spawnObstacle();
            }

            // プレイヤー物理計算
            player.vy += gravity;
            player.y += player.vy;

            if (player.y >= 205) {
                player.y = 205;
                player.vy = 0;
                player.grounded = true;
            }

            // アニメーションフレーム更新
            if (player.grounded) {
                player.animFrame += baseGameSpeed * 0.08;
            }

            // 障害物移動 ＆ 当たり判定
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= obs.speed;

                const padding = 4;
                if (
                    player.x + padding < obs.x + obs.w - padding &&
                    player.x + player.w - padding > obs.x + padding &&
                    player.y + padding < obs.y + obs.h - padding &&
                    player.y + player.h - padding > obs.y + padding
                ) {
                    isDead = true;
                    stopBGM();
                }

                if (obs.x + obs.w < 0) {
                    obstacles.splice(i, 1);
                }
            }
        }

        // --- 描画処理 ---
        function drawPlayer(x, y, grounded, frame) {
            ctx.strokeStyle = '#00ff66';
            ctx.fillStyle = '#00ff66';
            ctx.lineWidth = 2.5;

            const headRadius = 5;
            const headX = x + 10;
            const headY = y + headRadius;

            // 頭
            ctx.beginPath();
            ctx.arc(headX, headY, headRadius, 0, Math.PI * 2);
            ctx.stroke();

            // 胴体
            const bodyStartY = headY + headRadius;
            const bodyEndY = y + 25;
            ctx.beginPath();
            ctx.moveTo(headX, bodyStartY);
            ctx.lineTo(headX, bodyEndY);
            ctx.stroke();

            // 腕と脚
            if (grounded) {
                const legAngle = Math.sin(frame) * 12;
                const armAngle = Math.cos(frame) * 10;

                ctx.beginPath();
                ctx.moveTo(headX, bodyEndY);
                ctx.lineTo(headX - legAngle, y + 40);
                ctx.moveTo(headX, bodyEndY);
                ctx.lineTo(headX + legAngle, y + 40);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(headX, bodyStartY + 4);
                ctx.lineTo(headX - armAngle, bodyStartY + 14);
                ctx.moveTo(headX, bodyStartY + 4);
                ctx.lineTo(headX + armAngle, bodyStartY + 14);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(headX, bodyEndY);
                ctx.lineTo(headX - 8, y + 35);
                ctx.moveTo(headX, bodyEndY);
                ctx.lineTo(headX + 8, y + 33);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(headX, bodyStartY + 4);
                ctx.lineTo(headX - 10, bodyStartY - 2);
                ctx.moveTo(headX, bodyStartY + 4);
                ctx.lineTo(headX + 10, bodyStartY - 2);
                ctx.stroke();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 地面
            ctx.fillStyle = '#4a4a5a';
            ctx.fillRect(0, 245, canvas.width, 55);
            ctx.fillStyle = '#00ff66';
            ctx.fillRect(0, 245, canvas.width, 3);

            // プレイヤー
            drawPlayer(player.x, player.y, player.grounded, player.animFrame);

            // 障害物
            obstacles.forEach(obs => {
                const img = bossImages[obs.imgIndex];
                if (img.complete && img.naturalWidth !== 0) {
                    ctx.drawImage(img, obs.x, obs.y, obs.w, obs.h);
                } else {
                    ctx.fillStyle = obs.isFloating ? '#ff00aa' : '#aa00ff';
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(BOSS_SETTINGS[obs.imgIndex].name, obs.x + obs.w/2, obs.y + obs.h/2);
                }
            });

            // スコア表示
            ctx.fillStyle = '#ffffff';
            ctx.font = '20px monospace';
            ctx.textAlign = 'right';
            ctx.fillText('SCORE: ' + Math.floor(score / 10), canvas.width - 20, 35);

            // ゲームオーバー時表示
            if (isDead) {
                ctx.textAlign = 'center';
                ctx.fillStyle = '#ff3344';
                ctx.font = 'bold 42px sans-serif';
                ctx.fillText('ざんねん', canvas.width / 2, 130);
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px sans-serif';
                ctx.fillText('さようなら', canvas.width / 2, 170);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
