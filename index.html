<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOMIGAME</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            background-color: #121214;
            color: #f0f0f0;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { 
            margin: 0 0 10px 0; 
            font-size: clamp(16px, 5vw, 24px); 
            color: #4da6ff; 
            text-align: center;
        }
        canvas { 
            background: #0a0a0f; 
            border: 2px solid #444; 
            border-radius: 8px; 
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <h1>神に誓うな己に誓え.39</h1>

    <canvas id="gameCanvas" width="800" height="300"></canvas>
    <audio id="bgmAudio" src="bgm.mp3" loop></audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bgmAudio = document.getElementById('bgmAudio');

        // 透過判定用の隠しキャンバス
        const hitCanvas = document.createElement('canvas');
        const hitCtx = hitCanvas.getContext('2d', { willReadFrequently: true });

        bgmAudio.volume = 0.25;

        let bgmStarted = false;
        function playBGM() {
            if (bgmStarted) return;
            bgmAudio.play().then(() => { bgmStarted = true; }).catch(() => {});
        }

        function stopBGM() {
            bgmAudio.pause();
            bgmAudio.currentTime = 0;
            bgmStarted = false;
        }

        const BOSS_SETTINGS = [
            { name: 'boss',  w: 90,  h: 60,  speedMult: 1.0,  isFloating: false },
            { name: 'boss2', w: 75,  h: 75,  speedMult: 1.5,  isFloating: false },
            { name: 'boss3', w: 60,  h: 90,  speedMult: 0.7,  isFloating: false },
            { name: 'boss4', w: 120, h: 150, speedMult: 1.25, isFloating: false },
            { name: 'boss5', w: 120, h: 90,  speedMult: 0.5,  isFloating: true  }
        ];

        const bossImages = [];
        BOSS_SETTINGS.forEach((setting, index) => {
            const img = new Image();
            img.src = (index === 0) ? 'boss.png' : `${setting.name}.png`;
            bossImages.push(img);
        });

        let player = {
            x: 80,
            y: 205,
            w: 20,
            h: 40,
            vy: 0,
            grounded: true,
            jumpCount: 0,
            maxJumps: 2,
            animFrame: 0
        };
        const gravity = 0.6;
        const jumpPower = -12.5;

        let isDead = false;
        let canRetry = true;
        let deadTime = 0;
        let score = 0;
        let baseGameSpeed = 6;
        let frameCount = 0;
        let obstacles = [];

        let lastTime = 0;
        let lastJumpTime = 0;

        function doJump() {
            if (isDead) return;

            const now = Date.now();
            if (now - lastJumpTime < 100) return;
            lastJumpTime = now;

            playBGM();

            if (player.jumpCount < player.maxJumps) {
                player.vy = jumpPower;
                player.grounded = false;
                player.jumpCount++;
            }
        }

        function handleInput() {
            if (isDead) {
                if (canRetry && (Date.now() - deadTime >= 1000)) {
                    resetGame();
                }
            } else {
                doJump();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'ArrowUp') handleInput();
            if (e.key === 'r' || e.key === 'R') {
                if (isDead && Date.now() - deadTime >= 1000) resetGame();
                else if (!isDead) resetGame();
            }
        });
        
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) return;
            handleInput();
            if (e.cancelable) e.preventDefault();
        }, { passive: false });

        document.addEventListener('click', (e) => {
            if (e.pointerType === 'mouse') {
                handleInput();
            }
        });

        function resetGame() {
            player.y = 205; 
            player.vy = 0; 
            player.grounded = true;
            player.jumpCount = 0;
            obstacles = [];
            score = 0;
            baseGameSpeed = 6;
            frameCount = 0;
            isDead = false;
            canRetry = true;
            lastTime = performance.now();
            playBGM();
        }

        function triggerGameOver() {
            isDead = true;
            deadTime = Date.now();
            stopBGM();
        }

        // 安全対策を入れた当たり判定関数
        function checkPixelCollision(player, obs) {
            // 1. 基本となるバウンディングボックス（矩形）判定
            const padding = 2; // 少し甘めの判定領域
            const pLeft = player.x + padding;
            const pRight = player.x + player.w - padding;
            const pTop = player.y + padding;
            const pBottom = player.y + player.h - padding;

            const oLeft = obs.x;
            const oRight = obs.x + obs.w;
            const oTop = obs.y;
            const oBottom = obs.y + obs.h;

            if (pLeft >= oRight || pRight <= oLeft || pTop >= oBottom || pBottom <= oTop) {
                return false; // 矩形自体が重なっていない
            }

            // 画像の読み込みが不十分な場合は矩形判定を優先
            const img = bossImages[obs.imgIndex];
            if (!img.complete || img.naturalWidth === 0) {
                return true;
            }

            try {
                // 2. 透過領域のチェック
                const overlapX = Math.max(pLeft, oLeft);
                const overlapY = Math.max(pTop, oTop);
                const overlapW = Math.min(pRight, oRight) - overlapX;
                const overlapH = Math.min(pBottom, oBottom) - overlapY;

                if (overlapW <= 0 || overlapH <= 0) return false;

                hitCanvas.width = obs.w;
                hitCanvas.height = obs.h;
                hitCtx.clearRect(0, 0, obs.w, obs.h);
                hitCtx.drawImage(img, 0, 0, obs.w, obs.h);

                const imgOverlapX = Math.floor(overlapX - oLeft);
                const imgOverlapY = Math.floor(overlapY - oTop);
                const checkW = Math.max(1, Math.floor(overlapW));
                const checkH = Math.max(1, Math.floor(overlapH));

                const imageData = hitCtx.getImageData(imgOverlapX, imgOverlapY, checkW, checkH);
                const pixels = imageData.data;

                // アルファ値（透明度）が一定以上の部分に接触しているか確認
                for (let i = 3; i < pixels.length; i += 4) {
                    if (pixels[i] > 50) { 
                        return true; // 不透明領域に当たったらヒット
                    }
                }
                return false; // 透明部分のみ重なっている場合
            } catch (err) {
                // セキュリティ制限や読み込みエラー時はゲームを停止させず矩形判定にする
                return true;
            }
        }

        function spawnObstacle() {
            let bossIndex;
            const rand = Math.random();
            const currentDisplayScore = Math.floor(score / 10);

            if (currentDisplayScore <= 140) {
                bossIndex = rand < 0.60 ? 0 : 1;
            } else if (currentDisplayScore <= 219) {
                if (rand < 0.40) bossIndex = 0;
                else if (rand < 0.70) bossIndex = 1;
                else bossIndex = 2;
            } else if (currentDisplayScore <= 309) {
                if (rand < 0.30) bossIndex = 0;
                else if (rand < 0.60) bossIndex = 1;
                else if (rand < 0.80) bossIndex = 2;
                else bossIndex = 3;
            } else {
                if (rand < 0.30) bossIndex = 0;
                else if (rand < 0.50) bossIndex = 1;
                else if (rand < 0.70) bossIndex = 2;
                else if (rand < 0.80) bossIndex = 3;
                else bossIndex = 4;
            }

            const setting = BOSS_SETTINGS[bossIndex];

            const minDistance = setting.isFloating ? 380 : 240;
            const lastObs = obstacles[obstacles.length - 1];
            if (lastObs && (canvas.width - lastObs.x < minDistance)) {
                return;
            }

            let yPos;
            if (setting.isFloating) {
                yPos = 145; 
            } else {
                yPos = 245 - setting.h;
            }

            obstacles.push({
                x: canvas.width,
                y: yPos,
                w: setting.w,
                h: setting.h,
                speed: baseGameSpeed * setting.speedMult,
                imgIndex: bossIndex,
                isFloating: setting.isFloating
            });
        }

        function update(deltaTime) {
            if (isDead) return;

            const dt = deltaTime / (1000 / 60);

            frameCount += dt;
            score += dt;

            const currentDisplayScore = Math.floor(score / 10);

            if (Math.floor(frameCount) % 400 === 0) baseGameSpeed += 0.005 * dt;

            if (currentDisplayScore >= 310 && baseGameSpeed < 10) {
                baseGameSpeed = 10;
            }

            if (Math.random() < 0.02 * dt) {
                spawnObstacle();
            }

            player.vy += gravity * dt;
            player.y += player.vy * dt;

            if (player.y >= 205) {
                player.y = 205;
                player.vy = 0;
                player.grounded = true;
                player.jumpCount = 0;
            }

            if (player.grounded) {
                player.animFrame += baseGameSpeed * 0.08 * dt;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= obs.speed * dt;

                if (checkPixelCollision(player, obs)) {
                    triggerGameOver();
                }

                if (obs.x + obs.w < 0) {
                    obstacles.splice(i, 1);
                }
            }
        }

        function drawPlayer(x, y, grounded, frame) {
            ctx.strokeStyle = '#00ff66';
            ctx.fillStyle = '#00ff66';
            ctx.lineWidth = 2.5;

            const headRadius = 5;
            const headX = x + 10;
            const headY = y + headRadius;

            ctx.beginPath();
            ctx.arc(headX, headY, headRadius, 0, Math.PI * 2);
            ctx.stroke();

            const bodyStartY = headY + headRadius;
            const bodyEndY = y + 25;
            ctx.beginPath();
            ctx.moveTo(headX, bodyStartY);
            ctx.lineTo(headX, bodyEndY);
            ctx.stroke();

            if (grounded) {
                const legAngle = Math.sin(frame) * 12;
                const armAngle = Math.cos(frame) * 10;

                ctx.beginPath();
                ctx.moveTo(headX, bodyEndY);
                ctx.lineTo(headX - legAngle, y + 40);
                ctx.moveTo(headX, bodyEndY);
                ctx.lineTo(headX + legAngle, y + 40);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(headX, bodyStartY + 4);
                ctx.lineTo(headX - armAngle, bodyStartY + 14);
                ctx.moveTo(headX, bodyStartY + 4);
                ctx.lineTo(headX + armAngle, bodyStartY + 14);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(headX, bodyEndY);
                ctx.lineTo(headX - 8, y + 35);
                ctx.moveTo(headX, bodyEndY);
                ctx.lineTo(headX + 8, y + 33);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(headX, bodyStartY + 4);
                ctx.lineTo(headX - 10, bodyStartY - 2);
                ctx.moveTo(headX, bodyStartY + 4);
                ctx.lineTo(headX + 10, bodyStartY - 2);
                ctx.stroke();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#4a4a5a';
            ctx.fillRect(0, 245, canvas.width, 55);
            ctx.fillStyle = '#00ff66';
            ctx.fillRect(0, 245, canvas.width, 3);

            drawPlayer(player.x, player.y, player.grounded, player.animFrame);

            obstacles.forEach(obs => {
                const img = bossImages[obs.imgIndex];
                if (img.complete && img.naturalWidth !== 0) {
                    ctx.drawImage(img, obs.x, obs.y, obs.w, obs.h);
                } else {
                    ctx.fillStyle = obs.isFloating ? '#ff00aa' : '#aa00ff';
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(BOSS_SETTINGS[obs.imgIndex].name, obs.x + obs.w/2, obs.y + obs.h/2);
                }
            });

            ctx.fillStyle = '#ffffff';
            ctx.font = '20px monospace';
            ctx.textAlign = 'right';
            ctx.fillText('SCORE: ' + Math.floor(score / 10), canvas.width - 20, 35);

            if (isDead) {
                ctx.textAlign = 'center';
                ctx.fillStyle = '#ff3344';
                ctx.font = 'bold 42px sans-serif';
                ctx.fillText('ざんねん', canvas.width / 2, 130);
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px sans-serif';
                ctx.fillText('さようなら', canvas.width / 2, 170);
            }
        }

        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const deltaTime = Math.min(timestamp - lastTime, 100);
            lastTime = timestamp;

            update(deltaTime);
            draw();
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
