<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOMIGAME</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            background-color: #121214;
            color: #f0f0f0;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        canvas { 
            background: #0a0a0f; 
            border: 2px solid #444; 
            border-radius: 8px; 
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="300"></canvas>
    <audio id="bgmAudio" src="bgm.mp3" loop></audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bgmAudio = document.getElementById('bgmAudio');

        const hitCanvas = document.createElement('canvas');
        const hitCtx = hitCanvas.getContext('2d', { willReadFrequently: true });

        bgmAudio.volume = 0.25;

        // -------------------------------------------------------------
        // Web Audio API による高速・超低遅延 SE 再生システム
        // -------------------------------------------------------------
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let jumpBuffer1 = null;
        let jumpBuffer2 = null;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        async function loadSE(url) {
            try {
                const response = await fetch(url);
                const arrayBuffer = await response.arrayBuffer();
                initAudioContext();
                return await audioCtx.decodeAudioData(arrayBuffer);
            } catch (e) {
                console.error("SE load error:", e);
                return null;
            }
        }

        // SEの事前ロード
        loadSE('jump.wav').then(buf => jumpBuffer1 = buf);
        loadSE('jump2.wav').then(buf => jumpBuffer2 = buf);

        function playJumpSE(buffer) {
            if (!buffer) return;
            initAudioContext();

            const source = audioCtx.createBufferSource();
            const gainNode = audioCtx.createGain();

            source.buffer = buffer;
            gainNode.gain.value = 0.5; // 音量

            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            source.start(0); // 即時再生
        }

        let bgmStarted = false;
        function playBGM() {
            initAudioContext();
            if (bgmStarted) return;
            bgmAudio.play().then(() => { bgmStarted = true; }).catch(() => {});
        }

        function stopBGM() {
            bgmAudio.pause();
            bgmAudio.currentTime = 0;
            bgmStarted = false;
        }

        const BOSS_SETTINGS = [
            { name: 'boss',   w: 90,  h: 60,  speedMult: 1.0,  isFloating: false }, // 0
            { name: 'boss2',  w: 75,  h: 75,  speedMult: 1.5,  isFloating: false }, // 1
            { name: 'boss3',  w: 60,  h: 90,  speedMult: 0.7,  isFloating: false }, // 2
            { name: 'boss4',  w: 120, h: 150, speedMult: 1.25, isFloating: false }, // 3
            { name: 'boss5',  w: 95,  h: 155, speedMult: 0.4,  isFloating: false }, // 4
            { name: 'boss6',  w: 150, h: 150, speedMult: 1.0,  isFloating: false }, // 5
            { name: 'boss7',  w: 90,  h: 90,  speedMult: 1.0,  isFloating: false, isRotating: true }, // 6
            { name: 'boss8',  w: 130,  h: 130,  speedMult: 1.0,  isFloating: false }, // 7
            { name: 'boss10', w: 200,  h: 400, speedMult: 1.0,  isFloating: false }, // 8
            { name: 'boss13', w: 100, h: 100, speedMult: 1.3,  isFloating: true }  // 9
        ];

        // -------------------------------------------------------------
        // 出現スケジュール設定
        // -------------------------------------------------------------
        const STAGE_SCHEDULE = [
            // 10: bossを3体 通常スピード等間隔で
            { score: 10, bossIndex: 0, count: 3, delay: 200, speedMult: 1.0 },

            // 20: boss2を2体 どちらも通常スピード
            { score: 20, bossIndex: 1, count: 2, delay: 200, speedMult: 1.0 },

            // 30: bossを3体 通常スピードで等間隔
            { score: 30, bossIndex: 0, count: 3, delay: 200, speedMult: 1.0 },

            // 40: boss2を2体を高速スピード
            { score: 40, bossIndex: 1, count: 2, delay: 150, speedMult: 2.0 },

            // 50: boss3 (縦長)
            { score: 50, bossIndex: 2, count: 1 },

            // 80: boss4 (大型)
            { score: 80, bossIndex: 3, count: 1 },

            // 100: boss5
            { score: 100, bossIndex: 4, count: 1 },

            // 130: boss2 と boss (※少し間隔を空けて2連発)
            { score: 130, bossIndex: 1, count: 1 },
            { score: 130, bossIndex: 0, count: 1, delay: 280 },

            // 150: boss3 (縦長) -> boss4 (大型) -> boss5
            { score: 150, bossIndex: 2, count: 1, delay: 0 },
            { score: 150, bossIndex: 3, count: 1, delay: 120 },
            { score: 150, bossIndex: 4, count: 1, delay: 240 },

            // 220: boss6 (真ん中で0.5秒停止後、高速移動)
            { score: 220, bossIndex: 5, count: 1, specialBehavior: 'stopAndDash' },

            // 233: boss7クルクル攻撃
            { score: 233, bossIndex: 6, count: 1, delay: 0,   position: 'middle' },
            { score: 233, bossIndex: 6, count: 1, delay: 50,  position: 'middle' },
            { score: 233, bossIndex: 6, count: 1, delay: 70,  position: 'top' },
            { score: 233, bossIndex: 6, count: 1, delay: 90,  position: 'middle' },
            { score: 233, bossIndex: 6, count: 1, delay: 105, position: 'top' },
            { score: 233, bossIndex: 6, count: 1, delay: 150, position: 'middle' },
            { score: 233, bossIndex: 6, count: 1, delay: 160, position: 'middle' },
            { score: 233, bossIndex: 6, count: 1, delay: 170, position: 'middle' },
            { score: 233, bossIndex: 6, count: 1, delay: 200, position: 'bottom' },
            { score: 233, bossIndex: 6, count: 1, delay: 220, position: 'top' },

            // 270: boss13 上下にギザギザ動きながら少し早め。間隔40で3体連続
            { score: 270, bossIndex: 9, count: 3, delay: 55, speedMult: 1.3, specialBehavior: 'sineWave' },

            // 330: boss8 めちゃくちゃはやく目の前で1回止まりゆっくりになる
            { score: 330, bossIndex: 7, count: 1, speedMult: 3.5, specialBehavior: 'superDashStopSlow' },

            // 350: boss10 通常スピード通過後、画面外に出てプレイヤーのもとに一瞬戻ってくる
            { score: 350, bossIndex: 8, count: 1, speedMult: 1.0, specialBehavior: 'boomerangReturn' }
        ];

        const bossImages = [];
        BOSS_SETTINGS.forEach((setting, index) => {
            const img = new Image();
            img.src = (index === 0) ? 'boss.png' : `${setting.name}.png`;
            bossImages.push(img);
        });

        let player = {
            x: 80,
            y: 205,
            w: 20,
            h: 40,
            vy: 0,
            grounded: true,
            jumpCount: 0,
            maxJumps: 2,
            animFrame: 0
        };
        const gravity = 0.6;
        const jumpPower = -12.5;

        let isGameStarted = false;
        let isDead = false;
        let isCleared = false;
        let canRetry = true;
        let deadTime = 0;
        let score = 0;
        let baseGameSpeed = 6;
        let frameCount = 0;
        let obstacles = [];

        let lastTime = 0;
        let lastJumpTime = 0;
        let spawnQueue = [];

        function doJump() {
            if (!isGameStarted || isDead || isCleared) return;

            const now = Date.now();
            if (now - lastJumpTime < 100) return;
            lastJumpTime = now;

            playBGM();

            if (player.jumpCount < player.maxJumps) {
                if (player.jumpCount === 0) {
                    playJumpSE(jumpBuffer1);
                } else if (player.jumpCount === 1) {
                    playJumpSE(jumpBuffer2);
                }

                player.vy = jumpPower;
                player.grounded = false;
                player.jumpCount++;
            }
        }

        function handleInput() {
            initAudioContext();

            if (!isGameStarted) {
                isGameStarted = true;
                playBGM();
                return;
            }

            if (isDead || isCleared) {
                if (canRetry && (Date.now() - deadTime >= 1000)) {
                    resetGame();
                }
            } else {
                doJump();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'ArrowUp') handleInput();
            if (e.key === 'r' || e.key === 'R') {
                resetGame(0);
            }

            // デバッグ用ショートカットキー（1〜5で任意のスコアから開始）
            if (e.key === '1') resetGame(0);
            if (e.key === '2') resetGame(100);
            if (e.key === '3') resetGame(220);
            if (e.key === '4') resetGame(270);
            if (e.key === '5') resetGame(330);
        });
        
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) return;
            handleInput();
            if (e.cancelable) e.preventDefault();
        }, { passive: false });

        document.addEventListener('click', (e) => {
            if (e.pointerType === 'mouse') {
                handleInput();
            }
        });

        // startDisplayScore: 開始時のスコアを指定可能にする
        function resetGame(startDisplayScore = 0) {
            player.y = 205; 
            player.vy = 0; 
            player.grounded = true;
            player.jumpCount = 0;
            obstacles = [];
            score = startDisplayScore * 10; // ディスプレイスコアから内部スコアへ換算
            baseGameSpeed = 6;
            frameCount = 0;
            isGameStarted = true; // デバッグ切り替え時はそのままゲーム開始状態にする
            isDead = false;
            isCleared = false;
            canRetry = true;
            lastTime = performance.now();

            spawnQueue = [];
            STAGE_SCHEDULE.forEach(item => {
                const totalCount = item.count || 1;
                const interval = item.delay || 220;
                for (let i = 0; i < totalCount; i++) {
                    // 開始スコアより前のボスはすでにスキップ（処理済）扱いにする
                    const isAlreadyPassed = item.score < startDisplayScore;
                    spawnQueue.push({
                        triggerScore: item.score,
                        bossIndex: item.bossIndex,
                        delayOffset: (item.count > 1) ? (i * interval) : (item.delay || 0),
                        speedMult: item.speedMult,
                        specialBehavior: item.specialBehavior,
                        position: item.position,
                        triggered: isAlreadyPassed
                    });
                }
            });

            playBGM();
        }

        function triggerGameOver() {
            isDead = true;
            deadTime = Date.now();
            stopBGM();
        }

        function triggerGameClear() {
            isCleared = true;
            deadTime = Date.now();
            stopBGM();
        }

        function checkPixelCollision(player, obs) {
            const padding = 2;
            const pLeft = player.x + padding;
            const pRight = player.x + player.w - padding;
            const pTop = player.y + padding;
            const pBottom = player.y + player.h - padding;

            const oLeft = obs.x;
            const oRight = obs.x + obs.w;
            const oTop = obs.y;
            const oBottom = obs.y + obs.h;

            if (pLeft >= oRight || pRight <= oLeft || pTop >= oBottom || pBottom <= oTop) {
                return false;
            }

            const img = bossImages[obs.imgIndex];

            if (!img.complete || img.naturalWidth === 0) {
                return true;
            }

            try {
                const overlapX = Math.max(pLeft, oLeft);
                const overlapY = Math.max(pTop, oTop);
                const overlapW = Math.min(pRight, oRight) - overlapX;
                const overlapH = Math.min(pBottom, oBottom) - overlapY;

                if (overlapW <= 0 || overlapH <= 0) return false;

                hitCanvas.width = obs.w;
                hitCanvas.height = obs.h;
                hitCtx.clearRect(0, 0, obs.w, obs.h);

                if (obs.isRotating) {
                    hitCtx.save();
                    hitCtx.translate(obs.w / 2, obs.h / 2);
                    hitCtx.rotate(obs.rotation);
                    hitCtx.drawImage(img, -obs.w / 2, -obs.h / 2, obs.w, obs.h);
                    hitCtx.restore();
                } else {
                    hitCtx.drawImage(img, 0, 0, obs.w, obs.h);
                }

                const imgOverlapX = Math.floor(overlapX - oLeft);
                const imgOverlapY = Math.floor(overlapY - oTop);
                const checkW = Math.max(1, Math.floor(overlapW));
                const checkH = Math.max(1, Math.floor(overlapH));

                const imageData = hitCtx.getImageData(imgOverlapX, imgOverlapY, checkW, checkH);
                const pixels = imageData.data;

                for (let i = 3; i < pixels.length; i += 4) {
                    if (pixels[i] > 180) { 
                        return true;
                    }
                }
                return false;
            } catch (err) {
                return true;
            }
        }

        function checkScheduledSpawns(currentDisplayScore) {
            spawnQueue.forEach(item => {
                if (!item.triggered && currentDisplayScore >= item.triggerScore) {
                    if (!item.startFrame) {
                        item.startFrame = frameCount;
                    }
                    if (frameCount - item.startFrame >= (item.delayOffset / (baseGameSpeed / 6))) {
                        item.triggered = true;
                        spawnSpecificObstacle(item.bossIndex, item.speedMult, item.specialBehavior, item.position);
                    }
                }
            });
        }

        function spawnSpecificObstacle(bossIndex, customSpeedMult, specialBehavior, position) {
            const setting = BOSS_SETTINGS[bossIndex];
            let yPos;

            if (position === 'top') {
                yPos = 65;   // 上段
            } else if (position === 'middle') {
                yPos = 155;  // 中段
            } else if (position === 'bottom') {
                yPos = 245 - setting.h; // 下段 (地面ぴったり)
            } else {
                yPos = setting.isFloating ? 100 : (245 - setting.h);
            }

            const speedMult = customSpeedMult !== undefined ? customSpeedMult : setting.speedMult;

            obstacles.push({
                x: canvas.width,
                y: yPos,
                baseY: yPos,
                w: setting.w,
                h: setting.h,
                speed: baseGameSpeed * speedMult,
                imgIndex: bossIndex,
                isFloating: setting.isFloating,
                isRotating: !!setting.isRotating,
                rotation: 0,
                specialBehavior: specialBehavior,
                state: 'normal',
                stopTimer: 0,
                timeParam: 0,
                returned: false
            });
        }

        function update(deltaTime) {
            if (!isGameStarted || isDead || isCleared) return;

            const dt = deltaTime / (1000 / 60);

            frameCount += dt;
            score += dt;

            const currentDisplayScore = Math.floor(score / 10);

            checkScheduledSpawns(currentDisplayScore);

            player.vy += gravity * dt;
            player.y += player.vy * dt;

            if (player.y >= 205) {
                player.y = 205;
                player.vy = 0;
                player.grounded = true;
                player.jumpCount = 0;
            }

            if (player.grounded) {
                player.animFrame += baseGameSpeed * 0.08 * dt;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];

                if (obs.isRotating) {
                    obs.rotation += 0.08 * dt;
                }

                // ギザギザ（上下）移動
                if (obs.specialBehavior === 'sineWave') {
                    obs.timeParam += 0.15 * dt;
                    obs.y = obs.baseY + Math.sin(obs.timeParam) * 55;
                }

                // 超高速→プレイヤー手前で一瞬停止→超低速
                if (obs.specialBehavior === 'superDashStopSlow') {
                    if (obs.state === 'normal' && obs.x <= player.x + 180) {
                        obs.state = 'stopping';
                        obs.stopTimer = 18; // 約0.3秒停止
                    } else if (obs.state === 'stopping') {
                        obs.stopTimer -= dt;
                        if (obs.stopTimer <= 0) {
                            obs.state = 'slow';
                            obs.speed = baseGameSpeed * 0.35; // 遅くなる
                        }
                    }
                }

                // 真ん中で停止してダッシュ
                if (obs.specialBehavior === 'stopAndDash') {
                    if (obs.state === 'normal' && obs.x <= 350) {
                        obs.state = 'stopping';
                        obs.stopTimer = 30;
                    } else if (obs.state === 'stopping') {
                        obs.stopTimer -= dt;
                        if (obs.stopTimer <= 0) {
                            obs.state = 'dashing';
                            obs.speed = baseGameSpeed * 2.2;
                        }
                    }
                }

                // 通常移動（ストップ中でなければ）
                if (obs.state !== 'stopping') {
                    obs.x -= obs.speed * dt;
                }

                // 画面外に出て一瞬で戻ってくる（ブーメラン）処理
                if (obs.specialBehavior === 'boomerangReturn') {
                    if (!obs.returned && obs.x + obs.w < -10) {
                        obs.returned = true;
                        obs.x = player.x - 20; // プレイヤーの少し後ろから急襲
                        obs.y = 245 - obs.h;   // 地面ぴったり
                        obs.speed = baseGameSpeed * 2.5; // 右へ高速バック（画面外へ去る）
                    }
                }

                if (checkPixelCollision(player, obs)) {
                    triggerGameOver();
                }

                // ブーメランで画面右端を完全に超えた、または通常の左画面外消去
                if (obs.specialBehavior === 'boomerangReturn' && obs.returned) {
                    if (obs.x > canvas.width + 100) {
                        obstacles.splice(i, 1);
                    }
                } else if (obs.x + obs.w < -100) {
                    obstacles.splice(i, 1);
                }
            }

            const allTriggered = spawnQueue.every(item => item.triggered);
            if (allTriggered && obstacles.length === 0) {
                triggerGameClear();
            }
        }

        function drawPlayer(x, y, grounded, frame) {
            ctx.strokeStyle = '#00ff66';
            ctx.fillStyle = '#00ff66';
            ctx.lineWidth = 2.5;

            const headRadius = 5;
            const headX = x + 10;
            const headY = y + headRadius;

            ctx.beginPath();
            ctx.arc(headX, headY, headRadius, 0, Math.PI * 2);
            ctx.stroke();

            const bodyStartY = headY + headRadius;
            const bodyEndY = y + 25;
            ctx.beginPath();
            ctx.moveTo(headX, bodyStartY);
            ctx.lineTo(headX, bodyEndY);
            ctx.stroke();

            if (grounded) {
                const legAngle = Math.sin(frame) * 12;
                const armAngle = Math.cos(frame) * 10;

                ctx.beginPath();
                ctx.moveTo(headX, bodyEndY);
                ctx.lineTo(headX - legAngle, y + 40);
                ctx.moveTo(headX, bodyEndY);
                ctx.lineTo(headX + legAngle, y + 40);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(headX, bodyStartY + 4);
                ctx.lineTo(headX - armAngle, bodyStartY + 14);
                ctx.moveTo(headX, bodyStartY + 4);
                ctx.lineTo(headX + armAngle, bodyStartY + 14);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(headX, bodyEndY);
                ctx.lineTo(headX - 8, y + 35);
                ctx.moveTo(headX, bodyEndY);
                ctx.lineTo(headX + 8, y + 33);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(headX, bodyStartY + 4);
                ctx.lineTo(headX - 10, bodyStartY - 2);
                ctx.moveTo(headX, bodyStartY + 4);
                ctx.lineTo(headX + 10, bodyStartY - 2);
                ctx.stroke();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#4a4a5a';
            ctx.fillRect(0, 245, canvas.width, 55);
            ctx.fillStyle = '#00ff66';
            ctx.fillRect(0, 245, canvas.width, 3);

            drawPlayer(player.x, player.y, player.grounded, player.animFrame);

            obstacles.forEach(obs => {
                const img = bossImages[obs.imgIndex];
                ctx.save();

                if (obs.isRotating) {
                    ctx.translate(obs.x + obs.w / 2, obs.y + obs.h / 2);
                    ctx.rotate(obs.rotation);
                    if (img.complete && img.naturalWidth !== 0) {
                        ctx.drawImage(img, -obs.w / 2, -obs.h / 2, obs.w, obs.h);
                    } else {
                        ctx.fillStyle = '#ffaa00';
                        ctx.fillRect(-obs.w / 2, -obs.h / 2, obs.w, obs.h);
                    }
                } else {
                    if (img.complete && img.naturalWidth !== 0) {
                        ctx.drawImage(img, obs.x, obs.y, obs.w, obs.h);
                    } else {
                        ctx.fillStyle = obs.isFloating ? '#ff00aa' : '#aa00ff';
                        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                        ctx.fillStyle = '#ffffff';
                        ctx.font = '10px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(BOSS_SETTINGS[obs.imgIndex].name, obs.x + obs.w/2, obs.y + obs.h/2);
                    }
                }
                ctx.restore();
            });

            ctx.fillStyle = '#ffffff';
            ctx.font = '20px monospace';
            ctx.textAlign = 'right';
            ctx.fillText('SCORE: ' + Math.floor(score / 10), canvas.width - 20, 35);

            if (!isGameStarted) {
                ctx.textAlign = 'center';
                ctx.fillStyle = '#4da6ff';
                ctx.font = 'bold 32px sans-serif';
                ctx.fillText('神に誓うな己に誓え', canvas.width / 2, 150);
            }

            if (isDead) {
                ctx.textAlign = 'center';
                ctx.fillStyle = '#ff3344';
                ctx.font = 'bold 42px sans-serif';
                ctx.fillText('ざんねん', canvas.width / 2, 130);

                ctx.fillStyle = '#ffffff';
                ctx.font = '16px sans-serif';
                ctx.fillText('さようなら', canvas.width / 2, 170);
            }

            if (isCleared) {
                ctx.textAlign = 'center';
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 42px sans-serif';
                ctx.fillText('あなたのかち', canvas.width / 2, 130);

                ctx.fillStyle = '#ffffff';
                ctx.font = '16px sans-serif';
                ctx.fillText('さようなら', canvas.width / 2, 180);
            }
        }

        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const deltaTime = Math.min(timestamp - lastTime, 100);
            lastTime = timestamp;

            update(deltaTime);
            draw();
            requestAnimationFrame(loop);
        }

        resetGame(0);
        isGameStarted = false; // 初期ロード時のみスタート待機画面にする
        requestAnimationFrame(loop);
    </script>
</body>
</html>
