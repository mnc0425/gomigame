<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOMIGAME</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            background-color: #121214;
            color: #f0f0f0;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { 
            margin: 0 0 10px 0; 
            font-size: clamp(16px, 5vw, 24px); 
            color: #4da6ff; 
            text-align: center;
        }
        canvas { 
            background: #0a0a0f; 
            border: 2px solid #444; 
            border-radius: 8px; 
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <h1>神に誓うな己に誓え</h1>

    <canvas id="gameCanvas" width="800" height="300"></canvas>
    <audio id="bgmAudio" src="bgm.mp3" loop></audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bgmAudio = document.getElementById('bgmAudio');

        bgmAudio.volume = 0.25;

        let bgmStarted = false;
        function playBGM() {
            if (bgmStarted) return;
            bgmAudio.play().then(() => { bgmStarted = true; }).catch(() => {});
        }

        function stopBGM() {
            bgmAudio.pause();
            bgmAudio.currentTime = 0;
            bgmStarted = false;
        }

        const BOSS_SETTINGS = [
            { name: 'boss',  w: 90, h: 60, speedMult: 1.0,  isFloating: false },
            { name: 'boss2', w: 75, h: 75, speedMult: 1.5,  isFloating: false },
            { name: 'boss3', w: 60, h: 90, speedMult: 0.7,  isFloating: false },
            { name: 'boss4', w: 60, h: 90, speedMult: 1.25, isFloating: false },
            { name: 'boss5', w: 90, h: 60, speedMult: 0.5,  isFloating: true  }
        ];

        const bossImages = [];
        BOSS_SETTINGS.forEach((setting, index) => {
            const img = new Image();
            img.src = (index === 0) ? 'boss.png' : `${setting.name}.png`;
            bossImages.push(img);
        });

        let player = {
            x: 80,
            y: 205,
            w: 20,
            h: 40,
            vy: 0,
            grounded: true,
            jumpCount: 0,
            maxJumps: 2,
            animFrame: 0
        };
        const gravity = 0.6;
        const jumpPower = -12.5;

        let isDead = false;
        let canRetry = true;
        let deadTime = 0;
        let score = 0;
        let baseGameSpeed = 6;
        let frameCount = 0;
        let obstacles = [];

        let lastTime = 0;

        function doJump() {
            if (isDead) return;
            playBGM();

            if (player.jumpCount < player.maxJumps) {
                player.vy = jumpPower;
                player.grounded = false;
                player.jumpCount++;
            }
        }

        function handleInput() {
            if (isDead) {
                if (canRetry && (Date.now() - deadTime >= 1000)) {
                    resetGame();
                }
            } else {
                doJump();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'ArrowUp') handleInput();
            if (e.key === 'r' || e.key === 'R') {
                if (isDead && Date.now() - deadTime >= 1000) resetGame();
                else if (!isDead) resetGame();
            }
        });
        
        window.addEventListener('touchstart', (e) => {
            handleInput();
        }, { passive: true });

        document.addEventListener('click', (e) => {
            if (e.pointerType === 'mouse') {
                handleInput();
            }
        });

        function resetGame() {
            player.y = 205; 
            player.vy = 0; 
            player.grounded = true;
            player.jumpCount = 0;
            obstacles = [];
            score = 0;
            baseGameSpeed = 6;
            frameCount = 0;
            isDead = false;
            canRetry = true;
            lastTime = performance.now();
            playBGM();
        }

        function triggerGameOver() {
            isDead = true;
            deadTime = Date.now();
            stopBGM();
        }

        // スコアに応じた障害物（ボス）の生成
        function spawnObstacle() {
            let bossIndex;
            const rand = Math.random();
            const currentDisplayScore = Math.floor(score / 10);

            if (currentDisplayScore <= 140) {
                // 〜140: boss, boss2 のみ
                bossIndex = rand < 0.50 ? 0 : 1;
            } else if (currentDisplayScore <= 219) {
                // 141〜219: boss3 追加
                if (rand < 0.45) bossIndex = 0;
                else if (rand < 0.85) bossIndex = 1;
                else bossIndex = 2;
            } else if (currentDisplayScore <= 309) {
                // 220〜309: boss4 追加
                if (rand < 0.40) bossIndex = 0;
                else if (rand < 0.75) bossIndex = 1;
                else if (rand < 0.90) bossIndex = 2;
                else bossIndex = 3;
            } else {
                // 310〜: boss5 追加（全種類出現）
                if (rand < 0.35) bossIndex = 0;
                else if (rand < 0.65) bossIndex = 1;
                else if (rand < 0.80) bossIndex = 2;
                else if (rand < 0.95) bossIndex = 3;
                else bossIndex = 4;
            }

            const setting = BOSS_SETTINGS[bossIndex];

            const minDistance = setting.isFloating ? 380 : 240;
            const lastObs = obstacles[obstacles.length - 1];
            if (lastObs && (canvas.width - lastObs.x < minDistance)) {
                return;
            }

            let yPos;
            if (setting.isFloating) {
                yPos = 145; 
            } else {
                yPos = 245 - setting.h;
            }

            obstacles.push({
                x: canvas.width,
                y: yPos,
                w: setting.w,
                h: setting.h,
                speed: baseGameSpeed * setting.speedMult,
                imgIndex: bossIndex,
                isFloating: setting.isFloating
            });
        }

        function update(deltaTime) {
            if (isDead) return;

            const dt = deltaTime / (1000 / 60);

            frameCount += dt;
            score += dt;

            const currentDisplayScore = Math.floor(score / 10);

            if (Math.floor(frameCount) % 400 === 0) baseGameSpeed += 0.005 * dt;

            // スコア310到達時のスピード上昇設定
            if (currentDisplayScore >= 310 && baseGameSpeed < 10) {
                baseGameSpeed = 10;
            }
