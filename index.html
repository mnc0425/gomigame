<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOMIGAME</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            background-color: #121214;
            color: #f0f0f0;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { 
            margin: 0 0 10px 0; 
            font-size: clamp(16px, 5vw, 24px); 
            color: #4da6ff; 
            text-align: center;
        }
        canvas { 
            background: #0a0a0f; 
            border: 2px solid #444; 
            border-radius: 8px; 
            max-width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <h1>神ニ誓ウナ己ニ誓エ</h1>

    <canvas id="gameCanvas" width="800" height="300"></canvas>
    <audio id="bgmAudio" src="bgm.mp3" loop></audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bgmAudio = document.getElementById('bgmAudio');

        bgmAudio.volume = 0.25;

        let bgmStarted = false;
        function playBGM() {
            if (bgmStarted) return;
            bgmAudio.play().then(() => { bgmStarted = true; }).catch(() => {});
        }

        function stopBGM() {
            bgmAudio.pause();
            bgmAudio.currentTime = 0;
            bgmStarted = false;
        }

        const BOSS_SETTINGS = [
            { name: 'boss',  w: 90, h: 60, speedMult: 1.0,  isFloating: false },
            { name: 'boss2', w: 75, h: 75, speedMult: 1.5,  isFloating: false },
            { name: 'boss3', w: 60, h: 90, speedMult: 0.7,  isFloating: false },
            { name: 'boss4', w: 60, h: 90, speedMult: 1.25, isFloating: false },
            { name: 'boss5', w: 90, h: 60, speedMult: 0.5,  isFloating: true  }
        ];

        const bossImages = [];
        BOSS_SETTINGS.forEach((setting, index) => {
            const img = new Image();
            img.src = (index === 0) ? 'boss.png' : `${setting.name}.png`;
            bossImages.push(img);
        });

        // プレイヤー設定（ジャンプカウント追加）
        let player = {
            x: 80,
            y: 205,
            w: 20,
            h: 40,
            vy: 0,
            grounded: true,
            jumpCount: 0, // ジャンプ回数を記録
            maxJumps: 2,  // 2段ジャンプまで許可
            animFrame: 0
        };
        const gravity = 0.6;
        const jumpPower = -12.5;

        let isDead = false;
        let canRetry = true;
        let deadTime = 0;
        let score = 0;
        let baseGameSpeed = 6;
        let frameCount = 0;
        let obstacles = [];

        let lastTime = 0;

        // ジャンプ処理（2段ジャンプ対応）
        function doJump() {
            if (isDead) return;
            playBGM();

            // ジャンプ回数が最大回数（2回）未満ならジャンプ可能
            if (player.jumpCount < player.maxJumps) {
                player.vy = jumpPower;
                player.grounded = false;
                player.jumpCount++;
            }
        }

        function handleInput() {
            if (isDead) {
                if (canRetry && (Date.now() - deadTime >= 1000)) {
                    resetGame();
                }
            } else {
                doJump();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'ArrowUp') handleInput();
            if (e.key === 'r' || e.key === 'R') {
                if (isDead && Date.now() - deadTime >= 1000) resetGame();
                else if (!isDead) resetGame();
            }
        });
        
        window.addEventListener('touchstart', (e) => {
            handleInput();
        }, { passive: true });

        document.addEventListener('click', (e) => {
            if (e.pointerType === 'mouse') {
                handleInput();
            }
        });

        function resetGame() {
            player.y = 205; 
            player.vy = 0; 
            player.grounded = true;
            player.jumpCount = 0;
            obstacles = [];
            score = 0;
            baseGameSpeed = 6;
            frameCount = 0;
            isDead = false;
            canRetry = true;
            lastTime = performance.now();
            playBGM();
        }

        function triggerGameOver() {
            isDead = true;
            deadTime = Date.now();
            stopBGM();
